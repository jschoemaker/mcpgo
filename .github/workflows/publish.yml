name: Publish to npm with provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Opt the JS-based actions (checkout, setup-node) into Node 24, ahead of the
# 2026-06-02 default switch. See GitHub deprecation notice for Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted-publisher OIDC requires npm >= 11.5)
        # --force avoids the known "Cannot find module 'promise-retry'" race
        # where npm 10.x deletes its own files during the self-upgrade.
        run: npm install -g npm@11 --force

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Verify wrapper integrity sidecar
        run: |
          test -f build/wrapper.js
          test -f build/wrapper.js.sha256
          EXPECTED=$(cat build/wrapper.js.sha256 | tr -d '[:space:]')
          ACTUAL=$(shasum -a 256 build/wrapper.js | awk '{print $1}')
          echo "expected=$EXPECTED actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Publish to npm with provenance
        # Uses npm Trusted Publishers (OIDC) — no NPM_TOKEN needed.
        # Configure at: npmjs.com → @exfil/mcpgo → Settings → Trusted Publishers
        run: npm publish --provenance --access public
